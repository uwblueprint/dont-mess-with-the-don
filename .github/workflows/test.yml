name: Test codebase

on:
  push:
    branches:
      - main
    paths:
      - "backend/python/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/python/**"

jobs:
  backend-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 3.11 matches backend/python/Dockerfile.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The functional tests build their schema on in-memory SQLite, so no
      # Postgres service is needed here.
      - name: Run tests
        env:
          APP_ENV: testing
        run: pytest -q
